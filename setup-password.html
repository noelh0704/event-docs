<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>產生登入設定｜活動文件公版平台</title>
<link rel="stylesheet" href="css/style.css">
<style>
  body { display: grid; place-items: center; min-height: 100vh; padding: 24px; }
  .setup { background: #fff; border-radius: 12px; box-shadow: 0 6px 30px rgba(29,43,58,.12); padding: 28px 30px; width: min(620px, 100%); }
  .setup h1 { font-size: 22px; margin-bottom: 6px; }
  .setup label { margin: 12px 0; }
  .setup input { width: 100%; }
  .meter { height: 6px; border-radius: 3px; background: var(--line); margin-top: 6px; overflow: hidden; }
  .meter i { display: block; height: 100%; width: 0; background: #a8321f; transition: width .2s; }
  pre { background: #1d2b3a; color: #fff; padding: 14px; border-radius: 8px; white-space: pre-wrap; word-break: break-all; font-size: 13px; }
  .steps { padding-left: 20px; color: var(--ink-soft); font-size: 14px; }
  .row { display: flex; gap: 8px; margin-top: 14px; }
</style>
</head>
<body>
<main class="setup">
  <h1>產生登入設定</h1>
  <p class="hint">在這裡輸入要開給同事使用的帳號與密碼。計算在你自己的瀏覽器完成，密碼不會傳到任何地方。產生的設定碼只包含加密後的結果，無法反推出密碼。</p>
  <form id="f">
    <label>帳號<input type="text" name="user" autocomplete="off" required placeholder="例如 rising"></label>
    <label>密碼<input name="pass" type="password" autocomplete="new-password" required>
      <div class="meter"><i id="meter"></i></div><span class="hint" id="tip">建議 12 個字元以上，混合英文大小寫、數字與符號。</span></label>
    <label>再輸入一次密碼<input name="pass2" type="password" autocomplete="new-password" required></label>
    <p class="auth-err" id="err" hidden></p>
    <button class="btn primary" type="submit">產生設定碼</button>
  </form>
  <div id="out" hidden>
    <h2 style="font-size:17px;margin:20px 0 8px">設定碼</h2>
    <pre id="code"></pre>
    <div class="row"><button class="btn primary" id="copy" type="button">複製設定碼</button></div>
    <ol class="steps">
      <li>把設定碼傳給負責維護網站的人，或自行貼進 <code>js/config.js</code> 的 <code>auth.users</code> 清單裡。</li>
      <li>要開多組帳號，就重複產生，每組一行。</li>
      <li>密碼請另外告訴同事，不要跟設定碼放在一起。</li>
    </ol>
  </div>
</main>
<script>
  // 與 js/auth.js 相同的演算法：PBKDF2-SHA256，210,000 次，隨機 16 位元組鹽值
  const ITER = 210000;
  const b64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));
  async function derive(password, saltBytes) {
    const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveBits']);
    return b64(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: saltBytes, iterations: ITER }, key, 256));
  }
  function score(p) {
    let s = Math.min(p.length, 16) / 16 * 50;
    [/[a-z]/, /[A-Z]/, /\d/, /[^A-Za-z0-9]/].forEach((r) => { if (r.test(p)) s += 12.5; });
    return Math.min(100, s);
  }
  const f = document.getElementById('f'), err = document.getElementById('err');
  f.pass.addEventListener('input', () => {
    const s = score(f.pass.value), m = document.getElementById('meter');
    m.style.width = s + '%'; m.style.background = s < 50 ? '#a8321f' : s < 80 ? '#d9772b' : '#2e7d4f';
  });
  f.addEventListener('submit', async (e) => {
    e.preventDefault();
    err.hidden = true;
    const user = f.user.value.trim(), pass = f.pass.value;
    if (!/^[\w.@-]{3,40}$/.test(user)) { err.textContent = '帳號請用 3 至 40 個英文、數字或 . _ - @。'; err.hidden = false; return; }
    if (pass !== f.pass2.value) { err.textContent = '兩次輸入的密碼不一樣。'; err.hidden = false; return; }
    if (pass.length < 8) { err.textContent = '密碼至少 8 個字元；因為設定碼會公開在網站程式中，建議 12 個字元以上。'; err.hidden = false; return; }
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const hash = await derive(pass, salt);
    document.getElementById('code').textContent = `{ user: '${user}', salt: '${b64(salt)}', hash: '${hash}', iterations: ${ITER} },`;
    document.getElementById('out').hidden = false;
    f.pass.value = ''; f.pass2.value = '';
  });
  document.getElementById('copy').addEventListener('click', async () => {
    await navigator.clipboard.writeText(document.getElementById('code').textContent);
    document.getElementById('copy').textContent = '已複製';
  });
</script>
</body>
</html>
